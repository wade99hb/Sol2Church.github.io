<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>행운을 드려요!!!</title>

    <style>

        body {
            margin: 0;
            padding: 15px;

            background: #f5f5f5;

            font-family: Arial, sans-serif;
            text-align: center;
        }


        .container {
            width: 100%;
            max-width: 500px;

            box-sizing: border-box;

            margin: 0 auto;
            padding: 25px 20px;

            background: white;

            border-radius: 20px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }


        /* 교회 소개 */

        .church {
            margin-bottom: 30px;
        }


        .church img {
            display: block;

            width: 100%;
            max-width: 300px;

            height: auto;

            margin: 0 auto 18px;

            border-radius: 15px;
        }


        .church-title {
            font-size: 23px;
            font-weight: bold;

            margin-bottom: 10px;
        }


        .church-description {
            font-size: 15px;

            line-height: 1.7;

            color: #666;
        }


        /* 결과 */

        .result {
            margin: 25px 0 15px;

            font-size: 28px;
            font-weight: bold;
        }


        /* 결과 이미지 */

        #resultImage img {
            display: block;

            width: 100%;
            max-width: 450px;

            height: auto;

            margin: 15px auto 0;

            border-radius: 15px;
        }


        /* 결과 메시지 */

        .message {
            margin-top: 20px;

            font-size: 16px;

            line-height: 1.7;

            color: #555;
        }

    </style>

</head>


<body>

    <div class="container">


        <!-- 교회 소개 -->

        <div class="church">

            <img src="church.jpg" alt="솔솔 교회">

            <div class="church-title">
                ♥ 솔솔 교회에 초대합니다 ♥
            </div>

            <div class="church-description">
                함께 웃고, 함께 나누며<br>
                따뜻한 사랑을 전하는 행복한 교회입니다.
            </div>

        </div>


        <!-- 추첨 결과 -->

        <div class="result" id="result">
            추첨 중...
        </div>


        <!-- 결과 이미지 -->

        <div id="resultImage"></div>


        <!-- 결과 메시지 -->

        <div class="message" id="message"></div>


    </div>


    <script>

        // 0 ~ 1 사이의 랜덤 숫자 생성
        const random = Math.random();

        let result;
        let image;
        let message;


        // 당첨 10%
        if (random < 0.10) {

            result = "🎉 축하합니다!";

            image = "winner.jpg";

            message =
                "오늘의 작은 행운을 축하드립니다!<br>" +
                "커피와 건빵을 맛있게 즐겨주세요 ♥";

        }


        // 꽝 90%
        else {

            result = "🍀 아쉽습니다!";

            image = "loser.jpg";

            message =
                "이번에는 아쉽지만 다음 기회를 기대해주세요.<br>" +
                "오늘도 행복하고 따뜻한 하루 보내세요 ♥";

        }


        // 결과 표시
        document.getElementById("result").textContent = result;


        // 이미지 표시
        document.getElementById("resultImage").innerHTML =
            '<img src="' + image + '" alt="추첨 결과 이미지">';


        // 메시지 표시
        document.getElementById("message").innerHTML = message;

    </script>

</body>

</html>
