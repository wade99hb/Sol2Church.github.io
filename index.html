<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>행운을 드려요!!!</title>

<style>

    body {
        margin: 0;
        padding: 30px 15px;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 30px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }


    /* 교회 소개 */

    .church {
        margin-bottom: 35px;
    }

    .church img {
        display: block;
        width: 100%;
        max-width: 300px;
        height: auto;
        margin: 0 auto 20px;
        border-radius: 15px;
    }

    .church-title {
        font-size: 25px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .church-description {
        font-size: 16px;
        line-height: 1.7;
        color: #666;
    }


    /* 추첨 영역 */

    h1 {
        margin-top: 25px;
        margin-bottom: 15px;
        font-size: 30px;
    }

    .question {
        font-size: 17px;
        color: #555;
    }


    /* 결과 */

    .result {
        margin: 30px 0 20px;
        font-size: 30px;
        font-weight: bold;
    }


    /* 결과 이미지 */

    #resultImage img {
        display: block;
        width: 100%;
        max-width: 500px;
        height: auto;
        margin: 20px auto 0;
        border-radius: 15px;
    }


    /* 작은 장식 문구 */

    .message {
        margin-top: 25px;
        font-size: 17px;
        line-height: 1.7;
        color: #555;
    }

</style>
```

</head>

<body>

<div class="container">

```
<!-- ========================= -->
<!-- 교회 소개 -->
<!-- ========================= -->

<div class="church">

    <img src="church.jpg" alt="교회 이미지">

    <div class="church-title">
        ♥ 솔솔 교회에 초대합니다 ♥
    </div>

    <div class="church-description">
        함께 웃고, 함께 나누며<br>
        따뜻한 사랑을 전하는 행복한 교회입니다.
    </div>

</div>

<!-- 결과 이미지 -->

<div id="resultImage"></div>


<!-- 결과별 추가 문구 -->

<div class="message" id="message"></div>
```

</div>

<script>

    // =====================================
    // 추첨
    // =====================================

    const random = Math.random();

    let result;
    let image;
    let message;


    // =====================================
    // 당첨 10%
    // =====================================

    if (random < 0.10) {

        result = "🎉 축하합니다! 당첨입니다!";
        image = "winner.jpg";

        message =
            "오늘의 작은 행운을 축하드립니다!<br>" +
            "커피와 건빵을 맛있게 즐겨주세요 ♥";

    }


    // =====================================
    // 꽝 90%
    // =====================================

    else {

        result = "🍀 아쉽습니다!";
        image = "lose.jpg";

        message =
            "이번에는 아쉽지만 다음 기회를 기대해주세요.<br>" +
            "오늘도 행복하고 따뜻한 하루 보내세요 ♥";

    }


    // =====================================
    // 결과 표시
    // =====================================

    document.getElementById("result").textContent = result;


    // 이미지 표시

    document.getElementById("resultImage").innerHTML =
        '<img src="' + image + '" alt="추첨 결과 이미지">';


    // 추가 문구 표시

    document.getElementById("message").innerHTML = message;

</script>

</body>

</html>
