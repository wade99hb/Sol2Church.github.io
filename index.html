<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>행운을 드려요!!!</title>

<style>
    body {
        margin: 0;
        padding: 40px 20px;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 30px;
        background: white;
        border-radius: 15px;
    }

    h1 {
        margin-bottom: 20px;
    }

    img {
        display: block;
        width: 100%;
        max-width: 500px;
        height: auto;
        margin: 30px auto 0;
        border-radius: 10px;
    }

    .result {
        font-size: 32px;
        font-weight: bold;
        margin: 30px 0;
    }
</style>
```

</head>

<body>

```
<div class="container">

    <h1>♥두근두근♥</h1>

    <p>당신의 결과는?</p>

    <div class="result" id="result">
        추첨 중...
    </div>

    <!-- 추첨 결과에 따라 이미지가 들어갈 자리 -->
    <div id="image"></div>

</div>


<script>

    // 0 이상 1 미만의 무작위 숫자 생성
    const random = Math.random();

    let result;
    let image;

    // 25% 확률 - 1등
    if (random < 0.25) {

        result = "🎉 1등 상품 당첨!";
        image = "first.jpg";

    }

    // 25% 확률 - 2등
    else if (random < 0.50) {

        result = "🥳 축하합니다! 2등 상품입니다!";
        image = "second.jpg";

    }

    // 25% 확률 - 3등
    else if (random < 0.75) {

        result = "🍀 행운의 3등 상품!";
        image = "third.jpg";

    }

    // 25% 확률 - 꽝
    else {

        result = "😢 아쉽습니다!";
        image = "lose.jpg";

    }


    // 결과 문구 표시
    document.getElementById("result").textContent = result;


    // 결과 이미지 표시
    document.getElementById("image").innerHTML =
        '<img src="' + image + '" alt="추첨 결과 이미지">';

</script>
```

</body>
</html>
